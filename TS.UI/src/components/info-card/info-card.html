<div class="flex flex-col items-center w-full max-w-xs p-4">
  <p>{{ card()?.name }}</p>
  <div
    [ngClass]="{
      'p-1 rounded-md ': card()?.subTypeName === 'Foil',
    }"
    [ngStyle]="
      card()?.subTypeName === 'Foil'
        ? {
            background:
              'linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet)'
          }
        : {}
    "
  >
    <img class="h-72 w-54" [src]="card()?.imageUrl" alt="{{ card()?.name }}" />
  </div>
  <!-- <p>{{ card()?.extDescription }}</p> -->
  <p>Price: ${{ card()?.marketPrice || card()?.midPrice }}</p>
</div>
